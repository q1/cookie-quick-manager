name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Checks, builds, and packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check
      - run: bun audit --prod
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run lint:firefox
      - run: bun run zip
      - run: bun run verify:builds
      - run: bun run verify:sources
      - run: bun run release:prepare
      - name: Upload unsigned packages and corresponding source
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cookie-loom-unsigned-packages
          # WXT writes these verified archives beneath the hidden .output directory.
          include-hidden-files: true
          path: |
            apps/extension/.output/cookie-loom-*.zip
            apps/extension/.output/SHA256SUMS
            apps/extension/.output/RELEASE.json
          if-no-files-found: error
          retention-days: 14

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bunx --bun playwright install --with-deps chromium firefox
      - run: xvfb-run --auto-servernum bun run test:e2e
      - run: bun run test:firefox
      - name: Upload failed-test diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: browser-test-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  minimum-browsers:
    name: Minimum browser versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bunx --bun playwright install-deps chromium firefox
      - run: mkdir -p "$RUNNER_TEMP/cookie-loom-baselines"
      - name: Download pinned official baseline browsers
        working-directory: ${{ runner.temp }}/cookie-loom-baselines
        run: |
          curl --fail --location --retry 3 https://storage.googleapis.com/chrome-for-testing-public/132.0.6834.159/linux64/chrome-linux64.zip --output chrome.zip
          curl --fail --location --retry 3 https://archive.mozilla.org/pub/firefox/releases/140.0/linux-x86_64/en-US/firefox-140.0.tar.xz --output firefox.tar.xz
          sha256sum --check --strict <<'CHECKSUMS'
          955bbbe5bfc2c210eced0c8faf5bc4aca4640af63b33f7480a4c2fc0b449e6e6  chrome.zip
          ca3469774734743b878bca2cfb7efb7b8a8eb4a3c15c2f1f427fbc0472ad3f6e  firefox.tar.xz
          CHECKSUMS
          unzip -q chrome.zip
          tar -xf firefox.tar.xz
      - name: Test compiled extension on Chrome 132
        run: bun run test:e2e -- --project=chromium-extension
        env:
          CHROMIUM_BINARY: ${{ runner.temp }}/cookie-loom-baselines/chrome-linux64/chrome
      - name: Test native APIs on Firefox 140
        run: bun run test:firefox
        env:
          FIREFOX_BINARY: ${{ runner.temp }}/cookie-loom-baselines/firefox/firefox
