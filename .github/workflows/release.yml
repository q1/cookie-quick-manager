name: Preview release

on:
  push:
    tags: ['v*-preview.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate preview tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: bun scripts/validate-release-tag.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified preview
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cookie-loom-unsigned-packages
          path: release-assets
      - name: Verify checksums and source revision
        working-directory: release-assets
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          sha256sum --check --strict SHA256SUMS
          bun -e 'import fs from "node:fs"; const m = JSON.parse(fs.readFileSync("RELEASE.json")); if (m.sourceCommit !== process.env.EXPECTED_COMMIT || m.unsigned !== true) process.exit(1);'
      - name: Create and publish preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This release already exists. Refusing to replace published assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --prerelease --title "Cookie Loom $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release edit "$RELEASE_TAG" --draft=false
